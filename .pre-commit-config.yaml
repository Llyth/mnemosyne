# Catch locally what CI would catch: `uv run pre-commit install` once per clone,
# after scripts/setup-lua.sh (the Lua hooks run the tools it installs in .lua/).
default_install_hook_types: [pre-commit, pre-push]

repos:
  # The Lua tools at the versions scripts/setup-lua.sh pins.
  - repo: local
    hooks:
      - id: luacheck
        name: luacheck
        entry: .lua/bin/luacheck .
        language: system
        types: [lua]
        pass_filenames: false
      - id: busted
        name: busted
        entry: .lua/bin/busted
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Downloads the StyLua release binary: no Rust toolchain needed.
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.6.0
    hooks:
      - id: stylua-github

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  # Whitespace, file hygiene and key leaks, before they reach a commit.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$' # Markdown uses two trailing spaces as a line break
      - id: end-of-file-fixer
        exclude: ^graphify-out/ # generated by `graphify update .`, written without a final newline
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Reads .markdownlint-cli2.yaml, the same rules as CI.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

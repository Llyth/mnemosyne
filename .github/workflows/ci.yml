name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Runs on pull requests only: it gates what reaches `main`. What happens once
# code is on `main` (the release) belongs to another workflow.
jobs:
  # Pull requests that touch no relevant files skip the matching jobs (everything
  # but `gitleaks`). A job skipped by `if:` still counts as passing for the
  # required checks, unlike a workflow skipped by `paths:`, which would leave
  # them pending forever.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lua: ${{ steps.filter.outputs.lua }}
      addon: ${{ steps.filter.outputs.addon }}
      shell: ${{ steps.filter.outputs.shell }}
      workflows: ${{ steps.filter.outputs.workflows }}
      markdown: ${{ steps.filter.outputs.markdown }}
      trivy: ${{ steps.filter.outputs.trivy }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # What luacheck, StyLua and busted read, and what installs them.
            lua:
              - '**/*.lua'
              - '.luacheckrc'
              - '.busted'
              - 'stylua.toml'
              - 'scripts/setup-lua.sh'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            # What goes into the release zip, and how it is packaged.
            addon:
              - 'Mnemosyne.toc'
              - 'src/**'
              - '.pkgmeta'
              - '.github/workflows/ci.yml'
            shell:
              - '**/*.sh'
              - '.pre-commit-config.yaml'
            workflows:
              - '.github/**'
            markdown:
              - '**/*.md'
              - '.markdownlint*'
              - '.github/workflows/ci.yml'
            # The dev tools' lock file, the workflows (misconfig) and the config.
            trivy:
              - 'uv.lock'
              - 'pyproject.toml'
              - '.github/**'
              - 'trivy.yaml'

  lint:
    needs: changes
    if: >-
      needs.changes.outputs.lua == 'true' || needs.changes.outputs.shell == 'true' ||
      needs.changes.outputs.workflows == 'true' || needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        if: needs.changes.outputs.lua == 'true' || needs.changes.outputs.shell == 'true'
      - name: Lua (luacheck)
        if: ${{ !cancelled() && needs.changes.outputs.lua == 'true' }}
        run: .lua/bin/luacheck .
      # Through pre-commit, so the versions are the hooks' in
      # .pre-commit-config.yaml (which Dependabot keeps up to date).
      - name: Lua formatting (StyLua)
        if: ${{ !cancelled() && needs.changes.outputs.lua == 'true' }}
        run: uv run --no-sync pre-commit run stylua-github --all-files
      - name: Shell scripts (shellcheck)
        if: ${{ !cancelled() && needs.changes.outputs.shell == 'true' }}
        run: uv run --no-sync pre-commit run shellcheck --all-files
      - name: GitHub Actions (zizmor)
        if: ${{ !cancelled() && needs.changes.outputs.workflows == 'true' }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
      # Rules in .markdownlint-cli2.yaml.
      - name: Markdown
        if: ${{ !cancelled() && needs.changes.outputs.markdown == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  # The pure core, outside the client (docs/agents/testing.md).
  test:
    needs: changes
    if: needs.changes.outputs.lua == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: .lua/bin/busted --output=TAP

  # Builds the release zip the way release.yml does, without uploading it, so a
  # broken .toc or .pkgmeta fails here instead of at release time. The zip is
  # kept as an artifact to try in the game.
  package:
    needs: changes
    if: needs.changes.outputs.addon == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the packager names the version from git
          persist-credentials: false
      # -d: build only, never upload.
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d
          pandoc: false
      - name: Check the package
        run: |
          shopt -s nullglob
          zips=(.release/*.zip)
          [[ ${#zips[@]} -eq 1 ]] || { echo "::error::expected one zip, got ${#zips[@]}"; exit 1; }
          unzip -l "${zips[0]}"
          unzip -Z1 "${zips[0]}" | grep -qx 'Mnemosyne/Mnemosyne.toc'
          if unzip -Z1 "${zips[0]}" | grep -E '^Mnemosyne/(spec|docs|scripts)/'; then
            echo "::error::development files in the package: fix .pkgmeta"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mnemosyne-pr${{ github.event.pull_request.number }}
          path: .release/*.zip
          retention-days: 7

  # Vulnerabilities in the dev tools (uv.lock), misconfigurations and secrets;
  # the same config as the weekly scan (trivy.yml).
  trivy:
    needs: changes
    if: needs.changes.outputs.trivy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Picks up .gitleaks.toml from the repo root.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

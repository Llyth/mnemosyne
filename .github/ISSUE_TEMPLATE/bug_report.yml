# The addon's /mnemosyne report builds a link that pre-fills this form through
# query parameters named after the field ids (`report`, `version`): renaming one
# breaks that link (docs/agents/wow-api.md).
name: Bug report
description: Something in Mnemosyne does not work as it should.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting. Please do not paste other players' names or
        nicknames here: the debug report hides them for you. For a security
        problem, use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: report
    attributes:
      label: Debug report
      description: >-
        In the game, type `/mnemosyne report`, press Ctrl+C in the window that
        opens, and paste it here. If the addon does not load at all, write
        "does not load" and paste any Lua error instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, step by step, so it can be done again.
      placeholder: |
        1. Logged in on a registered character
        2. Joined a group with a guildmate
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mnemosyne version
      description: Also in the debug report; shown in the game's AddOns list.
      placeholder: v0.1.0
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - WoWUp
        - CurseForge app
        - Wago app
        - GitHub (by hand)
        - Other
